<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Admin</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            max-width:600px;
            margin:40px auto;
            padding:20px;
        }

        h1{
            text-align:center;
        }

        form{
            display:flex;
            flex-direction:column;
            gap:15px;
        }

        label{
            font-weight:bold;
        }

        input,
        select{
            padding:10px;
            font-size:16px;
        }

        button{
            padding:12px;
            font-size:16px;
            cursor:pointer;
        }

        #status{
            margin-top:20px;
            text-align:center;
            font-weight:bold;
        }

        .success{
            color:green;
        }

        .error{
            color:red;
        }
    </style>

</head>

<body>

<h1>Livestream Schedule Admin</h1>

<form id="scheduleForm">

    <label for="day">
        Day
    </label>

    <select id="day">

        <option>Monday</option>
        <option>Tuesday</option>
        <option>Wednesday</option>
        <option>Thursday</option>
        <option>Friday</option>
        <option>Saturday</option>
        <option>Sunday</option>

    </select>

    <label for="time">
        Time
    </label>

    <input
        id="time"
        type="text"
        placeholder="20:00">

    <label for="title">
        Stream Title
    </label>

    <input
        id="title"
        type="text"
        placeholder="Just Chatting">

    <button type="submit">
        Save Schedule
    </button>

</form>

<p id="status"></p>

<script src="js/admin.js"></script>

</body>
</html>
